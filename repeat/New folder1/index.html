<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Parallax Effect</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="parallax">
        <div class="text">
            <h1>Parallax Effect</h1>
            <p>Scroll down 👇</p>
        </div>
    </section>

    <section class="content">
        <h2>Parallax nədir?</h2>

        <p>
            Parallax effekti səhifəni aşağı-yuxarı sürüşdürərkən
            müxtəlif elementlərin fərqli sürətlə hərəkət etməsidir.
        </p>
    </section>

    <section class="parallax second">
        <div class="text">
            <h1>Welcome 👋</h1>
        </div>
    </section>

</body>
</html>
