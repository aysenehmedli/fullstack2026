<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://publicawesome.web.app/assets/fontawesome/css/all.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    
<div class="parent">
    <div class="left-aside">
        <div class="logo">
            <img src="./assets/img/GoMeal..png" alt="">
        </div>
        <div class="btns">
            <button class="btn active">
                <div><i class="fa-duotone fa-regular fa-plate-utensils"></i></div>
                <div>Dashboard</div>
            </button>
            <button class="btn">
                <div><i class="fa-solid fa-moped"></i></div>
                <div>Food Order</div>
            </button>
            <button class="btn">
                <div><i class="fa-solid fa-calendar-star"></i></div>
                <div>Favorite</div>
            </button>
            <button class="btn">
                <div><i class="fa-regular fa-message-pen"></i></div>
                <div>Message</div>
            </button>
            <button class="btn">
                <div><i class="fa-sharp fa-regular fa-clock-rotate-left"></i></div>
                <div>Order History</div>
            </button>
            <button class="btn">
                <div><i class="fa-solid fa-receipt"></i></div>
                <div>Bills</div>
            </button>
            <button class="btn">
                <div><i class="fa-duotone fa-light fa-gears"></i></div>
                <div>Setting</div>
            </button>
        </div>
        <div class="upgrade">
            <img src="./assets/img/banner.png" alt="">
        </div>
    </div>
    <div class="main">2</div>
    <div class="right-aside">3</div>
</div>
    
</body>
</html>
