<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://publicawesome.web.app/assets/fontawesome/css/all.css">
</head>

<body>
    <main>
        <section class="card">
            <div class="img">
                <img src="https://assets.adidas.com/images/w_500,f_auto,q_auto/235f6bebfc6c4541811d18a387ac3be4_9366/ULTRABOOST_1.0_SHOES_Black_HQ4206_HM1.jpg"
                    alt="">
            </div>
            <div class="info">
                <div class="head-info">
                    <h1>
                        Ultraboost 1.0
                    </h1>
                    <p id="category">Running shoes</p>
                </div>
                <span>
                    Experience the next level of comfort and performance with adidas Ultraboost. Designed for runners
                    who never stop.
                </span>
                <div class="price">
                    <p>
                        $119.99 <span id="old-price">$149.99</span>
                    </p>
                    <div class="rating">
                        <div class="stars">
                            <div class="icons">
                                <i class="fa-duotone fa-thin fa-star"></i>
                                <i class="fa-duotone fa-thin fa-star"></i>
                                <i class="fa-duotone fa-thin fa-star"></i>
                                <i class="fa-duotone fa-thin fa-star"></i>
                                <i class="fa-duotone fa-thin fa-star"></i>
                            </div>
                            <span><span id="bold">4.8</span>(124 reviews)</span>
                        </div>
                    </div>
                </div>
                <p id="color-name">Color</p>
                <div class="color">
                    
                    <button></button>
                    <button></button>
                    <button></button>
                    <button></button>
                </div>
                <div class="add-to-cart">
                    
                    <button><i class="fa-sharp fa-thin fa-cart-shopping"></i> Add to Cart</button>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
